version: 2
# Policy note:
# Prefer the latest patched LTS release when the current distribution has one.
# If that LTS still has a major applicable security flaw, use the latest stable
# release that fixes it. Otherwise use current compatible stable releases for
# dependencies without LTS, preserving framework BOM compatibility.
# Dependabot cannot encode dynamic LTS or security applicability rules, so keep
# broad update visibility and review frontend, backend, Actions, and all images
# against this policy manually. Never infer LTS solely from a "stable" tag.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/admin-ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/admin-ui"
    schedule:
      interval: "weekly"
