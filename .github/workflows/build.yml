name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Keep this exact check name aligned with main's existing protection rules.
    name: .github/workflows/build.yml
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inboxbridge
          POSTGRES_USER: inboxbridge
          POSTGRES_PASSWORD: inboxbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inboxbridge -d inboxbridge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JDBC_URL: jdbc:postgresql://localhost:5432/inboxbridge
      JDBC_USERNAME: inboxbridge
      JDBC_PASSWORD: inboxbridge

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Update npm
        working-directory: admin-ui
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Run backend tests
        run: mvn -q -Dit.test='*QuarkusIT' verify

      - name: Check workflow security regressions
        run: python3 scripts/security/test-workflows.py

      - name: Check repository privacy
        run: |
          python3 scripts/security/test-repository-privacy.py
          python3 scripts/security/test-secrets-rules.py

      - name: Scan tracked source for secrets and private identifiers
        run: sh scripts/security/scan-secrets.sh

      - name: Check Compose ingress compatibility
        run: |
          docker compose version
          python3 scripts/security/test-compose-ports.py

      - name: Check certificate isolation
        run: sh scripts/security/test-cert-init.sh

      - name: Install frontend dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Run frontend tests
        working-directory: admin-ui
        run: npm run test:run

      - name: Build frontend
        working-directory: admin-ui
        run: npm run build

      # Packaged integration tests activate the H2 build profile. Rebuild the
      # production PostgreSQL runtime before preparing any release image.
      - name: Rebuild production PostgreSQL runtime
        run: mvn -q -DskipTests package

      - name: Validate release helpers and build images
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: v0.0.0-ci
          BACKEND_IMAGE: inboxbridge-backend:ci
          FRONTEND_IMAGE: inboxbridge-frontend:ci
        run: |
          python3 scripts/release/test-images.py
          python3 scripts/release/prepare-images.py "$RUNNER_TEMP/inboxbridge-runtime"
          sh scripts/release/build-images.sh "$RUNNER_TEMP/inboxbridge-runtime"
          sh scripts/release/smoke-images.sh
          sh scripts/release/smoke-proxy-images.sh

      - name: Validate GitHub Pages site generator
        run: node site/test-config-generator.mjs

      - name: Test browser extensions
        run: |
          npm --prefix browser-extensions/chromium test
          npm --prefix browser-extensions/firefox test
