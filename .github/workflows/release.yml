name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release, for example v0.8.3"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release metadata
        id: release_meta
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG_NAME="$REF_NAME"
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v0.8.3." >&2
            exit 1
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "docs_base_url=https://github.com/${REPOSITORY}/blob/${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_meta.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Update npm
        working-directory: admin-ui
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verify backend and package runtime
        run: mvn -q -Dit.test='*QuarkusIT' verify

      - name: Install frontend dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Test frontend
        working-directory: admin-ui
        run: npm run test:run -- --maxWorkers=1

      - name: Validate workflows and release helpers
        run: |
          python3 scripts/security/test-workflows.py
          python3 scripts/release/test-images.py
          python3 scripts/security/test-repository-privacy.py
          python3 scripts/security/test-secrets-rules.py
          sh scripts/security/scan-secrets.sh

      - name: Build frontend
        working-directory: admin-ui
        run: npm run build

      - name: Test Chromium extension
        working-directory: browser-extensions/chromium
        run: npm test

      - name: Package Chromium extension
        working-directory: browser-extensions/chromium
        run: npm run zip:chrome

      - name: Test Firefox extension
        working-directory: browser-extensions/firefox
        run: npm test

      - name: Package Firefox extension
        working-directory: browser-extensions/firefox
        run: npm run zip:firefox

      # Packaged integration tests activate the H2 build profile. Rebuild the
      # production PostgreSQL runtime before preparing any release image.
      - name: Rebuild production PostgreSQL runtime
        run: mvn -q -DskipTests package

      - name: Resolve container metadata
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          python3 scripts/release/image-metadata.py --repository "$REPOSITORY" \
            --tag "$TAG_NAME" --revision "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/release/prepare-images.py "$RUNNER_TEMP/inboxbridge-runtime"

      - name: Build and smoke-test release images
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ steps.images.outputs.revision }}
          VERSION: ${{ steps.images.outputs.image_tag }}
          BACKEND_IMAGE: inboxbridge-backend:release-check
          FRONTEND_IMAGE: inboxbridge-frontend:release-check
        run: |
          sh scripts/release/build-images.sh "$RUNNER_TEMP/inboxbridge-runtime"
          sh scripts/release/smoke-images.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned multiarchitecture images
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ steps.images.outputs.revision }}
          VERSION: ${{ steps.images.outputs.image_tag }}
          BACKEND_REPOSITORY: ${{ steps.images.outputs.backend_image }}
          FRONTEND_REPOSITORY: ${{ steps.images.outputs.frontend_image }}
        run: sh scripts/release/publish-images.sh "$RUNNER_TEMP/inboxbridge-runtime"

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          cp README.md LICENSE docker-compose.yml .env.example Dockerfile pom.xml release-assets/
          cp -R docs release-assets/docs
          cp -R docker src scripts release-assets/
          cp docker-compose.images.yml release-assets/
          rsync -a --exclude=node_modules --exclude=dist --exclude=coverage admin-ui/ release-assets/admin-ui/
          cp -R target/quarkus-app "release-assets/inboxbridge-backend"
          cp -R admin-ui/dist "release-assets/inboxbridge-admin-ui"
          cp browser-extensions/chromium/dist/packages/*.zip "release-assets/"
          cp browser-extensions/firefox/dist/packages/*.xpi "release-assets/"
          cd release-assets
          zip -rq "../inboxbridge-${TAG_NAME}.zip" .
          cd ..
          sha256sum "inboxbridge-${TAG_NAME}.zip" > "inboxbridge-${TAG_NAME}.sha256"

      - name: Refresh packaged artifact metadata
        id: packaged_artifacts
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          echo "release_bundle=inboxbridge-${TAG_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "release_checksum=inboxbridge-${TAG_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "chrome_package=$(find browser-extensions/chromium/dist/packages -maxdepth 1 -type f -name '*.zip' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "firefox_package=$(find browser-extensions/firefox/dist/packages -maxdepth 1 -type f -name '*.xpi' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          DOCS_BASE_URL: ${{ steps.release_meta.outputs.docs_base_url }}
          RELEASE_BUNDLE: ${{ steps.packaged_artifacts.outputs.release_bundle }}
          RELEASE_CHECKSUM: ${{ steps.packaged_artifacts.outputs.release_checksum }}
          CHROME_PACKAGE: ${{ steps.packaged_artifacts.outputs.chrome_package }}
          FIREFOX_PACKAGE: ${{ steps.packaged_artifacts.outputs.firefox_package }}
          REPOSITORY: ${{ github.repository }}
          BACKEND_REPOSITORY: ${{ steps.images.outputs.backend_image }}
          FRONTEND_REPOSITORY: ${{ steps.images.outputs.frontend_image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHROME_FILENAME="$(basename "${CHROME_PACKAGE}")"
          FIREFOX_FILENAME="$(basename "${FIREFOX_PACKAGE}")"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            > generated-release-notes.json

          jq -r '.body' generated-release-notes.json > generated-release-notes-body.md
          CHANGELOG_URL="$(grep -Eo 'https://github.com/[^ )]+/compare/[^ )]+' generated-release-notes-body.md | tail -n 1 || true)"

          cat > release-notes.md <<EOF
          ## Install And Artifacts

          ### Main InboxBridge bundle

          - \`${RELEASE_BUNDLE}\`: full self-hosted release bundle with the backend runtime, admin UI build, Docker Compose files, and the bundled documentation set.
          - \`${RELEASE_CHECKSUM}\`: SHA-256 checksum file for verifying the main release archive before unpacking.

          Install and upgrade documentation:

          - [Project overview and quick start](${DOCS_BASE_URL}/README.md)
          - [Upgrade an existing installation](${DOCS_BASE_URL}/docs/SETUP.md#upgrade-an-existing-installation)
          - [Full setup guide](${DOCS_BASE_URL}/docs/SETUP.md)
          - [OAuth provider setup](${DOCS_BASE_URL}/docs/OAUTH_SETUP.md)
          - [Trust the local CA / HTTPS setup](${DOCS_BASE_URL}/docs/TRUST_LOCAL_CA.md)

          ### Container images

          - Backend: \`${BACKEND_REPOSITORY}:${TAG_NAME}\`
          - Frontend: \`${FRONTEND_REPOSITORY}:${TAG_NAME}\`
          - Platforms: linux/amd64 and linux/arm64. [Prebuilt-image setup](${DOCS_BASE_URL}/docs/CONTAINERS.md).

          ### Browser extensions

          - \`${CHROME_FILENAME}\`: packaged Chromium extension for Chrome, Edge, and other Chromium-based browsers.
          - \`${FIREFOX_FILENAME}\`: packaged Firefox extension artifact for manual installation or AMO signing/submission flows.

          Extension installation and packaging documentation:

          - [Browser extensions overview](${DOCS_BASE_URL}/browser-extensions/README.md)
          - [Chromium extension install and setup](${DOCS_BASE_URL}/browser-extensions/chromium/README.md)
          - [Firefox extension install and setup](${DOCS_BASE_URL}/browser-extensions/firefox/README.md)
          - [Browser store release workflow](${DOCS_BASE_URL}/docs/BROWSER_EXTENSION_STORES.md)

          ## Commit History

          - [View the full commit history and changelog for this release](${CHANGELOG_URL})

          ---

          EOF

          cat generated-release-notes-body.md >> release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=true
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then PRERELEASE=false; fi
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              "inboxbridge-${TAG_NAME}.zip" \
              "inboxbridge-${TAG_NAME}.sha256" \
              browser-extensions/chromium/dist/packages/*.zip \
              browser-extensions/firefox/dist/packages/*.xpi \
              --clobber
            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --prerelease="$PRERELEASE" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG_NAME}" \
              "inboxbridge-${TAG_NAME}.zip" \
              "inboxbridge-${TAG_NAME}.sha256" \
              browser-extensions/chromium/dist/packages/*.zip \
              browser-extensions/firefox/dist/packages/*.xpi \
              --title "${TAG_NAME}" \
              --prerelease="$PRERELEASE" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Resolve optional store submission flags
        id: store_flags
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          FIREFOX_AMO_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          FIREFOX_AMO_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        run: |
          if [ -n "${CHROME_WEBSTORE_CLIENT_ID}" ] && [ -n "${CHROME_WEBSTORE_CLIENT_SECRET}" ] && [ -n "${CHROME_WEBSTORE_EXTENSION_ID}" ] && [ -n "${CHROME_WEBSTORE_PUBLISHER_ID}" ] && [ -n "${CHROME_WEBSTORE_REFRESH_TOKEN}" ]; then
            echo "chrome_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "chrome_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${EDGE_ADDONS_API_KEY}" ] && [ -n "${EDGE_ADDONS_CLIENT_ID}" ] && [ -n "${EDGE_ADDONS_PRODUCT_ID}" ]; then
            echo "edge_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "edge_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${FIREFOX_AMO_API_KEY}" ] && [ -n "${FIREFOX_AMO_API_SECRET}" ]; then
            echo "firefox_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "firefox_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit Chromium package to Chrome Web Store
        id: chrome_webstore
        if: ${{ steps.store_flags.outputs.chrome_ready == 'true' }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_PACKAGE: ${{ steps.packaged_artifacts.outputs.chrome_package }}
        run: |
          set -euo pipefail
          TOKEN_RESPONSE="$(curl -fsS https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d 'grant_type=refresh_token')"
          ACCESS_TOKEN="$(printf '%s' "${TOKEN_RESPONSE}" | jq -r '.access_token')"
          if [ -z "${ACCESS_TOKEN}" ] || [ "${ACCESS_TOKEN}" = "null" ]; then
            echo "Chrome Web Store token exchange failed." >&2
            printf '%s\n' "${TOKEN_RESPONSE}" >&2
            exit 1
          fi
          ITEM_NAME="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            --data-binary @"${CHROME_PACKAGE}" \
            "https://chromewebstore.googleapis.com/upload/v2/${ITEM_NAME}:upload" \
            > chrome-upload-response.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/json" \
            -d '{"publishTarget":"default"}' \
            "https://chromewebstore.googleapis.com/v2/${ITEM_NAME}:publish" \
            > chrome-publish-response.json
          jq . chrome-upload-response.json > /dev/null
          jq . chrome-publish-response.json > /dev/null
          echo "status=submitted" >> "$GITHUB_OUTPUT"

      - name: Submit Chromium package to Microsoft Edge Add-ons
        id: edge_addons
        if: ${{ steps.store_flags.outputs.edge_ready == 'true' }}
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          EDGE_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_PACKAGE: ${{ steps.packaged_artifacts.outputs.chrome_package }}
        run: |
          set -euo pipefail
          curl -fsS -D edge-upload-headers.txt \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary @"${EDGE_PACKAGE}" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package" \
            > edge-upload-response.json
          curl -fsS -D edge-publish-headers.txt \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -d "{\"notes\":\"Automated GitHub Actions submission for ${TAG_NAME}\"}" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions" \
            > edge-publish-response.json
          jq . edge-upload-response.json > /dev/null || true
          jq . edge-publish-response.json > /dev/null || true
          echo "status=submitted" >> "$GITHUB_OUTPUT"

      - name: Submit Firefox package to AMO
        id: firefox_amo
        if: ${{ steps.store_flags.outputs.firefox_ready == 'true' }}
        env:
          FIREFOX_AMO_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          FIREFOX_AMO_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
        run: |
          set -euo pipefail
          npx --yes web-ext@10.8.0 sign \
            --source-dir browser-extensions/firefox/dist/firefox \
            --artifacts-dir browser-extensions/firefox/dist/amo-signed \
            --api-key "${FIREFOX_AMO_API_KEY}" \
            --api-secret "${FIREFOX_AMO_API_SECRET}" \
            --channel listed
          echo "status=submitted" >> "$GITHUB_OUTPUT"

      - name: Summarize extension store submissions
        if: always()
        env:
          CHROME_STATUS: ${{ steps.chrome_webstore.outputs.status }}
          EDGE_STATUS: ${{ steps.edge_addons.outputs.status }}
          FIREFOX_STATUS: ${{ steps.firefox_amo.outputs.status }}
        run: |
          {
            echo "## Browser extension store submissions"
            echo
            if [ -n "${CHROME_STATUS}" ]; then
              echo "- Chrome Web Store: submitted"
            else
              echo "- Chrome Web Store: skipped (missing secrets or store setup)"
            fi
            if [ -n "${EDGE_STATUS}" ]; then
              echo "- Microsoft Edge Add-ons: submitted"
            else
              echo "- Microsoft Edge Add-ons: skipped (missing secrets or store setup)"
            fi
            if [ -n "${FIREFOX_STATUS}" ]; then
              echo "- Firefox AMO: submitted"
            else
              echo "- Firefox AMO: skipped (missing secrets or store setup)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
