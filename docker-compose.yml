services:
  cert-init:
    image: alpine:3.24
    container_name: inboxbridge-cert-init
    volumes:
      - ./certs:/certs
      - ./docker:/opt/inboxbridge/docker:ro
    env_file:
      - .env
    command: ["sh", "/opt/inboxbridge/docker/cert-init.sh"]
    restart: "no"

  inboxbridge:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: inboxbridge
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      cert-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/backend:/etc/inboxbridge/certs:ro
    env_file:
      - .env
    restart: unless-stopped

  inboxbridge-admin:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
      network: host
    container_name: inboxbridge-admin
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      # Preserve reachability for existing installs that predate this setting.
      # Fresh installs explicitly select loopback in .env.example.
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_PORT:-3000}:8443"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      inboxbridge:
        condition: service_started
    volumes:
      - ./certs/frontend:/etc/inboxbridge/certs:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: inboxbridge-postgres
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: inboxbridge
      POSTGRES_USER: inboxbridge
      POSTGRES_PASSWORD: inboxbridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/etc/inboxbridge/certs:ro
      - ./docker:/opt/inboxbridge/docker:ro
    entrypoint:
      - /bin/bash
      - /opt/inboxbridge/docker/postgres-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxbridge -d inboxbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
