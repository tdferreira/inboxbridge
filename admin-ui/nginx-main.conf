worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  # The unprivileged runtime writes temporary data only to /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_host $forwarded_port {
    ~:(?<public_port>[0-9]+)$ $public_port;
    default 443;
  }

  # Empty keys exclude normal app traffic and SSE from authentication throttling.
  map $uri $auth_rate_key {
    default "";
    ~^/api/auth/(login|options|register|passkey)(/|$) $binary_remote_addr;
    ~^/api/extension/auth/ $binary_remote_addr;
  }
  limit_req_zone $auth_rate_key zone=auth_requests:10m rate=5r/s;
  include /etc/nginx/conf.d/*.conf;
}
